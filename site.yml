---
- name: Prepare Linux nodes for Kubernetes
  hosts: kubernetes
  become: true
  gather_facts: true
  tasks:
    - name: Install operating-system prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - containerd
          - curl
          - gpg
          - python3-apt
        state: present
        update_cache: true

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Remove persistent swap entries
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^\s*([^#]\S+\s+\S+\s+swap\s+\S+.*)$'
        replace: '# Disabled for Kubernetes: \1'

    - name: Load required kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load bridge netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Configure Kubernetes network sysctls
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
        reload: true
      loop:
        - name: net.bridge.bridge-nf-call-iptables
          value: "1"
        - name: net.bridge.bridge-nf-call-ip6tables
          value: "1"
        - name: net.ipv4.ip_forward
          value: "1"

    - name: Generate containerd configuration
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml
      notify: Restart containerd

    - name: Use systemd cgroups with containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^\s*SystemdCgroup = false$'
        replace: '            SystemdCgroup = true'
      notify: Restart containerd

    - name: Enable containerd
      ansible.builtin.service:
        name: containerd
        enabled: true
        state: started

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes package signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
        dest: /tmp/kubernetes-release.key
        mode: "0644"

    - name: Install Kubernetes package signing key
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Configure Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install Kubernetes packages
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes packages at the installed version
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet
      ansible.builtin.service:
        name: kubelet
        enabled: true

  handlers:
    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted

- name: Bootstrap the Kubernetes control plane
  hosts: kube_control_plane
  become: true
  tasks:
    - name: Initialize the cluster with kubeadm
      ansible.builtin.command:
        cmd: >-
          kubeadm init
          --apiserver-advertise-address={{ ansible_host }}
          --pod-network-cidr={{ pod_network_cidr }}
          --cri-socket=unix:///run/containerd/containerd.sock
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create kubeconfig directory for the administrative user
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy administrator kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Install the Flannel pod network
      ansible.builtin.command:
        cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f {{ cni_manifest_url }}
      register: cni_apply
      changed_when: "'created' in cni_apply.stdout or 'configured' in cni_apply.stdout"

    - name: Generate worker join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join
      changed_when: false

    - name: Store worker join command as a host fact
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ kubeadm_join.stdout }}"

- name: Join Kubernetes workers
  hosts: kube_workers
  become: true
  tasks:
    - name: Check whether the worker is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: worker_kubelet_config

    - name: Join the worker to the cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['kube_control_plane'][0]].kubeadm_join_command }} --cri-socket=unix:///run/containerd/containerd.sock"
      when: not worker_kubelet_config.stat.exists

- name: Prepare the validation client
  hosts: clients
  become: true
  tasks:
    - name: Install client validation tools
      ansible.builtin.apt:
        name:
          - curl
          - jq
        state: present
        update_cache: true

    - name: Install optional Gradebook smoke-test script
      ansible.builtin.copy:
        dest: /usr/local/bin/check-gradebook.sh
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -z "{{ gradebook_url }}" ]]; then
            echo "Set gradebook_url in group_vars/all.yml before running the smoke test."
            exit 2
          fi
          curl --fail --silent --show-error "{{ gradebook_url }}{{ gradebook_health_path }}" >/dev/null
          echo "Gradebook endpoint responded successfully."
